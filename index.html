<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Next Word Prediction | LSTM & FastAPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% -20%, #1e1b4b, #0f172a 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    .badge-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
    }

    .examples-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      margin-top: 10px;
      font-size: 1.15rem;
      line-height: 1.6;
    }

    .highlight-word {
      display: inline-block;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid var(--primary);
      color: #38bdf8;
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 700;
      margin: 0 2px;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-top: 14px;
    }

    .vocab-card {
      margin-top: 8px;
    }

    .vocab-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .vocab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .vocab-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      color: #94a3b8;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting to API...</span>
      </div>
      <h1>Next Word Prediction</h1>
      <p class="subtitle">Deep Learning LSTM sequence model connected to a FastAPI backend</p>
    </header>

    <div class="card">
      <div class="field-group">
        <label for="seedInput">Enter Seed Text</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="seedInput"
            placeholder="e.g. I love, deep learning, artificial intelligence..."
            autocomplete="off"
            autofocus
          />
          <select id="numWordsSelect" title="Number of sequential words to predict">
            <option value="1">1 word</option>
            <option value="2">2 words</option>
            <option value="3">3 words</option>
            <option value="4">4 words</option>
          </select>
        </div>
      </div>

      <div class="examples">
        <span class="examples-label">Try an example:</span>
        <button class="pill" onclick="setExample('I love')">I love</button>
        <button class="pill" onclick="setExample('machine learning')">machine learning</button>
        <button class="pill" onclick="setExample('deep learning')">deep learning</button>
        <button class="pill" onclick="setExample('artificial intelligence')">artificial intelligence</button>
      </div>

      <button id="predictBtn" class="btn" onclick="handlePredict()">
        <span id="btnText">Predict Next Word</span>
      </button>

      <div id="resultSection" class="result-section">
        <label>Generated Result</label>
        <div class="result-box" id="resultBox"></div>
        <div class="meta-row">
          <span id="metaInfo"></span>
          <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy Text</button>
        </div>
      </div>

      <div id="errorBox" class="error-msg" style="display: none;"></div>
    </div>

    <div class="card vocab-card">
      <div class="vocab-title">Trained Vocabulary Tokens</div>
      <div class="vocab-list" id="vocabList">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Loading vocabulary...</span>
      </div>
    </div>

    <footer>
      FastAPI &bull; TensorFlow &bull; <a href="/docs" target="_blank">API Docs (/docs)</a>
    </footer>
  </div>

  <script>
    // Detect backend base URL (works seamlessly if served by FastAPI or opened locally)
    const API_BASE = window.location.origin.startsWith('http') ? '' : 'http://127.0.0.1:8000';

    const seedInput = document.getElementById('seedInput');
    const numWordsSelect = document.getElementById('numWordsSelect');
    const predictBtn = document.getElementById('predictBtn');
    const btnText = document.getElementById('btnText');
    const resultSection = document.getElementById('resultSection');
    const resultBox = document.getElementById('resultBox');
    const metaInfo = document.getElementById('metaInfo');
    const errorBox = document.getElementById('errorBox');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const vocabList = document.getElementById('vocabList');

    let currentCompletedText = "";

    // Check API health and fetch vocabulary on page load
    async function init() {
      try {
        const healthRes = await fetch(`${API_BASE}/health`);
        if (healthRes.ok) {
          const data = await healthRes.json();
          statusDot.style.background = '#10b981';
          statusDot.style.boxShadow = '0 0 10px #10b981';
          statusText.textContent = `FastAPI Online (${data.model})`;
        } else {
          markOffline();
        }

        // Fetch vocabulary
        const vocabRes = await fetch(`${API_BASE}/vocabulary`);
        if (vocabRes.ok) {
          const vocabData = await vocabRes.json();
          renderVocabulary(vocabData.vocabulary);
        }
      } catch (err) {
        console.error("Health check error:", err);
        markOffline();
      }
    }

    function markOffline() {
      statusDot.style.background = '#ef4444';
      statusDot.style.boxShadow = '0 0 10px #ef4444';
      statusText.textContent = 'Backend Offline (start uvicorn app:app)';
    }

    function renderVocabulary(wordsObj) {
      if (!wordsObj) return;
      vocabList.innerHTML = Object.keys(wordsObj)
        .map(word => `<span class="vocab-item" onclick="setExample('${word}')" style="cursor: pointer;" title="Click to use">${word}</span>`)
        .join('');
    }

    function setExample(text) {
      seedInput.value = text;
      seedInput.focus();
      handlePredict();
    }

    // Trigger prediction on pressing Enter
    seedInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handlePredict();
      }
    });

    async function handlePredict() {
      const text = seedInput.value.trim();
      if (!text) {
        showError("Please enter some seed text first.");
        return;
      }

      clearMessages();
      setLoading(true);

      const numWords = parseInt(numWordsSelect.value, 10) || 1;

      try {
        const response = await fetch(`${API_BASE}/predict`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, num_words: numWords })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showError(data.message || (data.detail && data.detail[0]?.msg) || "Prediction failed.");
          return;
        }

        displayResult(data);
      } catch (err) {
        console.error("Prediction request failed:", err);
        showError("Failed to reach FastAPI backend. Is 'uvicorn app:app --reload' running?");
      } finally {
        setLoading(false);
      }
    }

    function displayResult(data) {
      resultSection.style.display = 'block';
      currentCompletedText = data.result;

      // Highlight the predicted words in the output
      const originalText = data.input_text;
      const predictedWords = data.predicted_words || [];

      let html = `<span>${escapeHtml(originalText)}</span>`;
      predictedWords.forEach(word => {
        html += ` <span class="highlight-word">${escapeHtml(word)}</span>`;
      });

      resultBox.innerHTML = html;

      metaInfo.textContent = predictedWords.length === 1
        ? `Predicted 1 word: "${predictedWords[0]}"`
        : `Predicted ${predictedWords.length} words`;
    }

    function copyResult() {
      if (!currentCompletedText) return;
      navigator.clipboard.writeText(currentCompletedText).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const orig = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = orig; }, 1800);
      });
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function clearMessages() {
      errorBox.style.display = 'none';
      resultSection.style.display = 'none';
    }

    function setLoading(isLoading) {
      predictBtn.disabled = isLoading;
      btnText.textContent = isLoading ? 'Predicting...' : 'Predict Next Word';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
